name: Capability contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
      - run: uv sync --directory python --python 3.13
      - run: python/.venv/bin/python -m pytest -c python/pyproject.toml python/tests -q
      - run: npm run build
      - run: npm test
